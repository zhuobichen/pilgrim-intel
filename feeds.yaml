      - {id: thepaper_hot, name: 澎湃新闻, type: thepaper, url: "https://cache.thepaper.cn/contentapi/wwwIndex/rightSidebar", extra: {limit: 20, article: true}}
      - {id: cctv_china, name: 央视网, type: cctv, url: "https://news.cctv.com/2019/07/gaiban/cmsdatainterface/page/china_1.jsonp", extra: {limit: 30}}
