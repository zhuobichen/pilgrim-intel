      - {id: ce_gdxw, name: 经济日报, type: html, url: "http://www.ce.cn/xwzx/gnsz/gdxw/", extra: {item: 'a[href*="/t20"]', base: "http://www.ce.cn/xwzx/gnsz/gdxw/", limit: 20, article: true}}
