      - {id: people_opinion, name: 人民网·观点, type: html, url: "http://opinion.people.com.cn/", extra: {item: "div.hdNews strong a", limit: 20, article: true}}
      - {id: people_politics, name: 人民网·时政, type: html, url: "http://politics.people.com.cn/GB/1024/index.html", extra: {item: "ul.list_16.mt10 li a", limit: 25, article: true}}
