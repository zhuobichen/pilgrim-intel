  # ── 📚 申论时政素材：考公申论专用 ──────────────────
  # standalone=true：单独发一封邮件，不并入上面的合并日报。
  - id: shenlun
    name: 申论时政素材
    llm: {model: deepseek-chat, api_key_env: DEEPSEEK_API_KEY, api_base: "https://api.deepseek.com", temperature: 0.4, max_tokens: 32000}
    push: {email: true, standalone: true, email_to: "${EMAIL_TO}"}
    # 正文增强：只对标记了 extra.article 的源抓正文，每源最多 6 篇、每篇留 900 字。
    # 列表页只给标题，正文才是「具体政策举措 / 评论原句」的来源。
    enrich: {article: true, per_source: 8, max_articles: 250, max_chars: 1000, concurrency: 12}
    schedule: "daily 18:30"
    enabled: true
    prompt_template: |
      你是公务员考试申论辅导专家。根据以下 {{COUNT}} 条来自中国官方媒体与政府网站的当日内容（含正文摘录），整理一份申论时政素材日报。

      【硬性要求】
      - 只使用给定条目中**实际出现**的文字。不得自行补全政策原文、领导人讲话、数据或文件编号；
        政策举措、权威表述、金句都要**取自所给内容**，不得改写或臆造。
      - 条目标注的「文件信息」（发文机关／文号／发布日期／主题分类）可直接引用，不要另行推测。
      - 每一个具体数字、文号、地名、单位名，都必须出现在所给条目里；给不出出处的就不要写。
      - 只有标题、没有正文的条目，仅作标题层面的索引，不展开推断。
      - 某类素材今日不足时，直接写「今日无」，不要为凑数编造。
      - **必须输出全部 6 个板块**（含最后的「申论话题索引」与「今日汇总分析」）。某一板块素材很多时，
        按重要性挑选、控制条数，不要为了穷举而把后面的板块挤掉。
      - **素材充足时要把内容写足**：每条该有的背景、举措、数据都写清楚，
        不要为省字数而简略成一句话。宁可写长，也不要让读者觉得空洞。
      - **排版**：一个条目里的多个要点要**分行**呈现（用 Markdown 的 `- ` 列表），
        不要挤成一整段、也不要用 `|` 把几个字段串起来——那样读起来很累。

      ## 📌 时政热点与官方定调
      5-8 条。每条写：**事件或政策名（含文号）** + 官方口径要点 + 一句「可提炼论点」。

      ## 📜 政策文件要点
      每份有正文的文件都要写：**发文机关 + 文号 + 发布日期**（取自条目的「文件信息」，缺失就省略）→ 核心举措（分点，取自正文）→ 可引用的权威表述（原文照抄并加引号）。
      没有正文的文件只列文件名，统一归到本节末尾的「仅有标题备查」清单里。

      ## 💬 权威评论金句
      6-10 条，每条严格用下面的格式：
      > 金句原文
      —— 媒体名《文章标题》
      **适用**：一句话说明用在申论的什么位置（开头／结尾／分论点升华），以及适合哪类话题。

      ## 🧩 案例与数据素材
      **最多 20 条**，按代表性挑选。每条严格按下面的分行格式写（**不要挤成一行、不要用 | 分隔**）：

      **N. 案例标题**
      - 主体：谁做的
      - 做法：怎么做的（保留原文的具体数字、地名、单位名）
      - 成效：结果如何（有数据就带数据）
      - 启示：对申论有什么价值
      - 可迁移到：话题A、话题B（2-4 个）

      ## 🏷️ 申论话题索引
      把上述内容归入：基层治理／乡村振兴／生态环保／科技创新／文化自信／民生保障／法治建设／数字经济／对外开放／干部作风 等话题，每个话题下列出可用条目编号。

      ## 📊 今日汇总分析
      这一节是**分析**，不是罗列，要给出你自己的判断：
      - **素材热度**：今天素材最集中的 2-3 个方向是什么（例如"'十五五'专项规划密集出台""干部问责通报集中发布"），
        并说明判断依据（哪几条、什么来源）。
      - **政策信号**：从今天这批文件与报道里，能看出哪些共同的政策取向或新动向？
        是否与前期（如"十五五"开局、扩大内需）呼应？
      - **备考建议**：今天最值得优先记诵的 3-5 条（金句／政策／案例各挑），
        逐条说明**适合什么题型、怎么用**（开头破题／分论点论证／结尾升华／对策依据）。
      - 若今天素材明显偏少或不典型，如实说明，不要硬凑分析。

      板块之间用 --- 分隔。

      {{CONTEXT}}
    sources:
      # ── 机器可读（RSS，实测在更新）──
      # 政策主干：政府网官方 RSS，条目即国务院/两办文件
      - {id: gov_rss, name: 中国政府网, type: rss, url: "http://www.gov.cn/pushinfo/v150203/rss.xml", extra: {article: true, article_sel: "//div[@id='UCAP-CONTENT']"}}
      # 政策文件库 JSON：每条直接带 文号/发文机关/发布日期/主题分类（免密钥）
      - {id: gov_policy, name: 中国政府网·政策库, type: govpolicy, extra: {limit: 30}, url: "https://sousuo.www.gov.cn/search-gov/data?t=zhengcelibrary&type=gwyzcwjk&q=&searchfield=title&sort=pubtime&sortType=1&p=1&n=30"}
      # 中新网是实测唯一「规范且在更新」的中央门户 RSS（最新到当天）
      - {id: chinanews_china, name: 中新网·时政, type: rss, url: "https://www.chinanews.com.cn/rss/china.xml", extra: {article: true}}
